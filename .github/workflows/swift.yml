name: Swift

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  swift-test:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Swift 6.4 toolchain
        run: swift --version | grep -E 'Swift version 6\.4([. ]|$)'

      - name: Test Swift package
        run: make swift-test
