name: Swift

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  swift-test:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Swift 6.4 toolchain
        run: make check-swift-toolchain

      - name: Test Swift package
        run: make swift-test
