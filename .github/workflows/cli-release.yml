name: CLI release packaging

on:
  pull_request:
    paths:
      - "Package.*"
      - "Makefile"
      - "examples/local-passport.json"
      - "Sources/**"
      - "scripts/package_cli.py"
      - "Tests/Packaging/test_package_cli.py"
      - ".github/workflows/cli-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Candidate SemVer version (no publication or deployment)"
        required: true
        default: "0.0.0-candidate"

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container:
      image: swift:6.4-noble@sha256:64bab762bc73a3fda6d9ebc559258bd6d7660c10a705bb25ecacad2f99d066f9
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: |
          apt-get update && apt-get install --yes python3 git make
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify Swift 6.4 toolchain
        run: swift --version | grep -E 'Swift version 6\.4([. ]|$)'
      - name: Test issuer and packaging
        run: |
          make swift-test SWIFT_FLAGS="--jobs 2"
          make test-package-cli
      - name: Build candidate archive and smoke-check extracted bytes
        env:
          RELEASE_VERSION: ${{ inputs.version || '0.0.0-ci' }}
        run: make package-cli CLI_RELEASE_VERSION="$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-candidate-${{ matrix.runner }}-${{ github.sha }}
          path: .build/cli-release/*
          if-no-files-found: error

  macos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift 6.4 toolchain
        run: swift --version | grep -E 'Swift version 6\.4([. ]|$)'
      - name: Test issuer and packaging
        run: |
          make swift-test SWIFT_FLAGS="--jobs 2"
          make test-package-cli
      - name: Build candidate archive and smoke-check extracted bytes
        env:
          RELEASE_VERSION: ${{ inputs.version || '0.0.0-ci' }}
        run: make package-cli CLI_RELEASE_VERSION="$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-candidate-macos-${{ github.sha }}
          path: .build/cli-release/*
          if-no-files-found: error
